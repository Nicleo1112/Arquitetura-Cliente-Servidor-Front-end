<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livraria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

    <h1 class="mb-4">📚 Livraria</h1>

    <!-- Filtro -->
    <h5>Filtrar livros</h5>
    <div class="row g-2 mb-4">
        <div class="col-md-3">
            <input id="f-titulo" type="text" class="form-control" placeholder="Título">
        </div>
        <div class="col-md-3">
            <input id="f-autor" type="text" class="form-control" placeholder="Autor">
        </div>
        <div class="col-md-2">
            <input id="f-ano-min" type="number" class="form-control" placeholder="Ano mín.">
        </div>
        <div class="col-md-2">
            <input id="f-ano-max" type="number" class="form-control" placeholder="Ano máx.">
        </div>
        <div class="col-md-2">
            <button onclick="buscarLivros()" class="btn btn-primary w-100">Filtrar</button>
        </div>
    </div>

    <!-- Adicionar -->
    <h5>Adicionar livro</h5>
    <div class="row g-2 mb-4">
        <div class="col-md-4">
            <input id="n-titulo" type="text" class="form-control" placeholder="Título">
        </div>
        <div class="col-md-4">
            <input id="n-autor" type="text" class="form-control" placeholder="Autor">
        </div>
        <div class="col-md-2">
            <input id="n-ano" type="number" class="form-control" placeholder="Ano">
        </div>
        <div class="col-md-2">
            <button onclick="adicionarLivro()" class="btn btn-success w-100">Adicionar</button>
        </div>
    </div>

    <!-- Tabela -->
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Título</th>
                <th>Autor</th>
                <th>Ano</th>
                <th></th>
            </tr>
        </thead>
        <tbody id="tabela-livros"></tbody>
    </table>

    <script>
        const API = 'https://livraria-api-btc4e6eucreuctae.eastus-01.azurewebsites.net/api/livros';

        async function buscarLivros() {
            const params = new URLSearchParams();
            const titulo = document.getElementById('f-titulo').value;
            const autor = document.getElementById('f-autor').value;
            const ano_min = document.getElementById('f-ano-min').value;
            const ano_max = document.getElementById('f-ano-max').value;
            if (titulo) params.append('titulo', titulo);
            if (autor) params.append('autor', autor);
            if (ano_min) params.append('ano_min', ano_min);
            if (ano_max) params.append('ano_max', ano_max);

            const res = await fetch(`${API}?${params}`);
            const livros = await res.json();
            renderTabela(livros);
        }

        async function adicionarLivro() {
            const titulo = document.getElementById('n-titulo').value.trim();
            const autor = document.getElementById('n-autor').value.trim();
            const ano = parseInt(document.getElementById('n-ano').value);

            if (!titulo || !autor || !ano) return alert('Preencha todos os campos.');

            await fetch(API, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ titulo, autor, ano })
            });

            document.getElementById('n-titulo').value = '';
            document.getElementById('n-autor').value = '';
            document.getElementById('n-ano').value = '';
            buscarLivros();
        }

        async function removerLivro(titulo) {
            await fetch(`${API}/${encodeURIComponent(titulo)}`, { method: 'DELETE' });
            buscarLivros();
        }

        function renderTabela(livros) {
            document.getElementById('tabela-livros').innerHTML = livros.map(l => `
                <tr>
                    <td>${l.Titulo}</td>
                    <td>${l.Autor}</td>
                    <td>${l.Ano}</td>
                    <td>
                        <button onclick="removerLivro('${l.Titulo.replace(/'/g, "\\'")}')" class="btn btn-danger btn-sm">Remover</button>
                    </td>
                </tr>
            `).join('');
        }

        buscarLivros();
    </script>
</body>
</html>
